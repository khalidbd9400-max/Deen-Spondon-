<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Deen Spondon — দ্বীনের পথে</title>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cinzel:wght@700;900&family=Hind+Siliguri:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--green:#0e5c3f;--green-d:#052a1d;--black:#050a08;--gold:#c9a227;

*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Hind Siliguri',system-ui,sans-serif;background:var(--black);color:var(--card-tx);line-height:1.6;-webkit-font-smoothing:antialiased;transition:background .35s}
body[data-t="hisnul"]{--card-bg:#fff;--card-bd:#b6e3c7;--card-tx:#0c2417;--card-hv:#f2fdf6;background:#eefaf2;color:#0c2417}
body[data-t="econ"]{--card-bg:#fff;--card-bd:#cfdcd2;--card-tx:#14251c;--card-hv:#f5f8f5;background:#f3f6f3;color:#14251c}
body[data-t="prophets"]{--card-bg:#fdfbf3;--card-bd:#ded3ae;--card-tx:#2b2415;--card-hv:#f7f2e2;background:#efe9d8;color:#2b2415}
body[data-t="sahaba"]{--card-bg:rgba(255,255,255,.06);--card-bd:rgba(120,220,180,.28);--card-tx:#eafaf2;--card-hv:rgba(255,255,255,.11);background:#06231c}
body[data-t="stories"]{--card-bg:#fff;--card-bd:#c6dccb;--card-tx:#152a1d;--card-hv:#f1f9f4;background:#ecf4ee;color:#152a1d}
body[data-t="names"]{--card-bg:#fff;--card-bd:#1a1a1a;--card-tx:#0a0a0a;--card-hv:#f6f6f6;background:#fbfbfb;color:#0a0a0a}
body[data-t="donate"]{--card-bg:#fff;--card-bd:#f2c3cb;--card-tx:#2a0b12;--card-hv:#fff5f6;background:#fdeef1;color:#2a0b12}
body[data-t="dua"]{--card-bg:#fff;--card-bd:#d9e6dc;--card-tx:#13261b;--card-hv:#f3faf5;background:#f7fbf8;color:#13261b}
body[data-t="hadith"]{background:linear-gradient(180deg,#04120d,#062a1e 40%,#04120d)}
body[data-t="home"]{background:radial-gradient(1200px 600px at 50% -10%,#0b3d2b,#050a08 70%)}
#splash{position:fixed;inset:0;z-index:999;display:grid;place-items:center;text-align:center;
background:radial-gradient(circle at 50% 45%,#0f6b4a 0%,#062a1e 45%,#030807 100%);transition:opacity .8s,visibility .8s}
#splash.hide{opacity:0;visibility:hidden}
.splash-in{position:relative;padding:2rem}
.splash-txt{font-family:'Cinzel',serif;font-weight:900;font-size:clamp(2.1rem,9vw,5.4rem);letter-spacing:.10em;
background:linear-gradient(180deg,#ffffff,#d9f5e6 35%,#c9a227 100%);-webkit-background-clip:text;background-clip:text;color:transparent;
filter:drop-shadow(0 6px 26px rgba(201,162,39,.45));animation:rise .9s cubic-bezier(.2,.8,.2,1) both}
.splash-sub{margin-top:.9rem;font-size:.95rem;letter-spacing:.35em;color:#a8e3c6;text-transform:uppercase;animation:rise 1s .2s both}
.splash-line{width:120px;height:2px;margin:1.4rem auto 0;background:linear-gradient(90deg,transparent,#c9a227,transparent);animation:rise 1s .35s both}
@keyframes rise{from{opacity:0;transform:translateY(26px)}to{opacity:1;transform:none}}
.wrap{max-width:1080px;margin:0 auto;padding:0 16px 70px}
.topbar{display:flex;align-items:center;gap:12px;padding:16px 0 6px;max-width:1080px;margin:0 auto;padding-inline:16px}
.brand{font-family:'Cinzel',serif;font-weight:900;letter-spacing:.14em;font-size:1.05rem;
background:linear-gradient(90deg,#eafff4,#c9a227);-webkit-background-clip:text;background-clip:text;color:transparent;cursor:pointer}
.back{margin-left:auto;display:inline-flex;align-items:center;gap:7px;border:1px solid var(--card-bd);background:var(--card-bg);
color:var(--card-tx);padding:7px 15px;border-radius:999px;font-size:.86rem;cursor:pointer;font-family:inherit}
.back:hover{background:var(--card-hv)}
h1.title{font-size:clamp(1.35rem,4.6vw,2rem);font-weight:700;text-align:center;margin:14px 0 4px}
p.lead{text-align:center;opacity:.72;font-size:.9rem;margin-bottom:26px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px;margin-top:8px}
.grid.one{grid-template-columns:1fr}
.card{display:block;text-decoration:none;color:var(--card-tx);background:var(--card-bg);border:1px solid var(--card-bd);
border-radius:16px;padding:14px;cursor:pointer;transition:.22s;box-shadow:0 8px 26px rgba(0,0,0,.10)}
.card:hover{transform:translateY(-4px);background:var(--card-hv);box-shadow:0 14px 34px rgba(0,0,0,.20);border-color:var(--gold)}
.card h3{font-size:1rem;font-weight:600;text-align:center;margin-bottom:10px;min-height:2.6em;display:grid;place-items:center}
.thumb{position:relative;aspect-ratio:16/10;border-radius:11px;overflow:hidden;display:grid;place-items:center;
background:linear-gradient(135deg,#0c4a34,#06201a)}
.thumb .g{position:absolute;font-size:1.9rem;opacity:.55}
.thumb img{position:relative;width:100%;height:100%;object-fit:cover;display:block;z-index:2}
.row{display:flex;align-items:center;gap:14px;text-align:left}
.row .num{flex:0 0 46px;height:46px;display:grid;place-items:center;border-radius:12px;font-weight:700;

body[data-t="econ"] .row .num{background:linear-gradient(145deg,#eaf3ec,#d7e6db);color:#0e5c3f;border:1px solid #b9d2c1}
.row .txt{flex:1;font-size:.97rem;font-weight:500}
.sub{display:block;font-size:.76rem;opacity:.68;margin-top:3px;font-weight:400}
.meta{font-size:.74rem;opacity:.7;text-align:center}
.hero-hand{position:fixed;inset:0;z-index:900;display:grid;place-items:center;background:#fff;transition:.5s}
.hero-hand.hide{opacity:0;visibility:hidden}
.hero-hand span{font-size:clamp(4rem,20vw,9rem);animation:pulse 1.1s infinite}
@keyframes pulse{0%,100%{transform:scale(1);opacity:.85}50%{transform:scale(1.12);opacity:1}}
.bismillah{font-family:'Amiri',serif;font-size:clamp(1.5rem,6vw,2.6rem);text-align:center;margin:10px 0 4px;
background:linear-gradient(180deg,#eafff4,#c9a227);-webkit-background-clip:text;background-clip:text;color:transparent}
.namebox{background:var(--card-bg);border:1px solid var(--card-bd);border-radius:14px;padding:14px 10px;text-align:center}
.namebox .ar{font-family:'Amiri',serif;font-size:1.45rem;font-weight:700;direction:rtl;line-height:1.9}
.namebox .bn{font-size:.9rem;font-weight:600;margin-top:6px}
.namebox .mn{font-size:.76rem;opacity:.72;margin-top:2px}
.pdfbox{border:1px dashed var(--card-bd);border-radius:16px;padding:26px 18px;text-align:center;opacity:.85;margin-top:20px}
.foot{margin-top:52px;text-align:center;font-size:.82rem;opacity:.72;border-top:1px solid var(--card-bd);padding-top:22px;line-height:2}
.foot a{color:inherit;text-decoration:none;border-bottom:1px dotted currentColor;cursor:pointer}
.copybox{background:var(--card-bg);border:1px solid var(--card-bd);border-radius:16px;padding:20px;text-align:center}
.copybox .no{font-size:1.5rem;font-weight:700;letter-spacing:.06em;margin:8px 0}
.btn{border:none;border-radius:10px;padding:9px 20px;font-family:inherit;font-weight:600;cursor:pointer;background:#e2136e;color:#fff;font-size:.85rem}
.btn.ok{background:#0e5c3f}
.gal{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.gal img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:12px;cursor:pointer;border:1px solid var(--card-bd)}
#lb{position:fixed;inset:0;z-index:950;background:rgba(3,8,6,.94);display:none;place-items:center;padding:18px}
#lb.on{display:grid}
#lb img{max-width:100%;max-height:78vh;border-radius:12px}
#lb .bar{display:flex;gap:10px;margin-top:14px}
#lb a,#lb button{border-radius:10px;padding:9px 18px;font-family:inherit;font-size:.85rem;cursor:pointer;
border:1px solid rgba(255,255,255,.3);background:rgba(255,255,255,.1);color:#fff;text-decoration:none}
.content{background:var(--card-bg);border:1px solid var(--card-bd);border-radius:16px;padding:22px;margin-top:18px;font-size:.97rem;white-space:pre-wrap}
@media(max-width:520px){.grid{gap:12px}.card{padding:11px}.card h3{font-size:.88rem}}
</style>
</head>

P.stories=()=>{document.body.dataset.t='stories';return `${bar()}<div class="wrap">${head('ইসলামিক গল্প','PDF পড়তে গল্পে ক্লিক করুন')}<div class="grid one">${STORIES.map((t,i)=>`<a class="card" href="pdf/stories/${i+1}.pdf" target="_blank"><div class="row"><span class="num">${bn(i+1)}</span><span class="txt">${t}</span></div></a>`).join('')}</div>${foot()}</div>`};

P.donate=()=>{document.body.dataset.t='donate';return `${bar()}<div class="wrap">${head('দান করুন')}<div class="copybox"><p>অসহায় মানুষদের পাশে দাঁড়াতে নিচের দেওয়া নাম্বারে টাকা পাঠাতে পারেন। আপনার দানের টাকা অবশ্যই একজন অসহায় মানুষের কাছে পৌঁছে দেয়া হবে।</p><p style="margin-top:14px;font-size:.85rem;opacity:.75">Nagad / Bkash</p><div class="no" id="don">01647778190</div><button class="btn" id="cpy" onclick="copyNo()">কপি করুন</button><p style="margin-top:12px;font-size:.8rem;opacity:.7">Parsonal</p></div>${foot()}</div>`};

P.book=(k)=>{
 document.body.dataset.t='hadith';
 const map={
  'fiqh':['ইসলামী ফিকাহ','# এখানে কিতাবের বিস্তারিত লিখো'],
  'qudsi':['হাদিসে কুদসি','# এখানে হাদিস কুদসি লিখো'],
  'ruq-1':['রুকিয়াহ','# এখানে রুকিয়া কাকে বলে লিখো'],
  'ruq-2':['রুকিয়াহ','# এখানে সুন্নাহ-তে বর্ণিত রুকিয়াহ সমূহ লিখো']
 };
 let title='',body='';
 if(map[k]){[title,body]=map[k];}
 else if(k.startsWith('h-')){title=decodeURIComponent(k.slice(2));body='# এখানে '+title+' এর হাদিসগুলো লিখো';}
 else if(k.startsWith('hisn-')){title='হিসনুল মুসলিম — '+HISN[+k.slice(5)-1][0];body='# এখানে '+title+' এর দোয়াগুলো লিখো';}
 else if(k.startsWith('p-')){title=PROPHETS[+k.slice(2)];body='# এখানে '+title+' এর জীবনী লিখো';}
 else if(k.startsWith('s-')){title=SAHABA[+k.slice(2)];body='# এখানে '+title+' এর জীবনী লিখো';}
 else if(k.startsWith('a-')){title=AMAL[+k.slice(2)];body='# এখানে '+title+' লিখো';}
 else if(k.startsWith('dua-')){const r=k.slice(4);title=isNaN(r)?r:('# দোয়া নং '+r);body='# এখানে '+title+' লিখো';}
 return `${bar()}<div class="wrap">${head(title)}<div class="content">${body}</div>${foot()}</div>`;
};

let CUR={p:'home',x:undefined};
function go(p,x){CUR={p:p,x:x};render();}
function render(){
 const p=CUR.p,x=CUR.x;
 if(p==='dua'){
   const hs=$('#handSplash');
   hs.style.display='grid';
   setTimeout(()=>{hs.classList.add('hide');setTimeout(()=>{hs.style.display='none';hs.classList.remove('hide');},500);},1400);
 }
 try{ app.innerHTML=(P[p]||P.home)(x); }catch(e){ app.innerHTML='<div style="padding:30px;text-align:center">ত্রুটি: '+e.message+'</div>'; }
 window.scrollTo(0,0);
}
function openLb(src){$('#lbImg').src=src;$('#lbDl').href=src;$('#lb').classList.add('on');}
function copyNo(){const t=$('#don').textContent;navigator.clipboard.writeText(t).then(()=>{const b=$('#cpy');b.textContent='✓ কপি হয়েছে';b.classList.add('ok');setTimeout(()=>{b.textContent='কপি করুন';b.classList.remove('ok');},1600);});}
render();
setTimeout(()=>{const s=$('#splash');s.classList.add('hide');setTimeout(()=>s.remove(),900);},2600);
</script>
